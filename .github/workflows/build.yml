name: build

# タグを打つと Windows の .exe と macOS の .app を作り、Releases に添付する。
# 手動実行（workflow_dispatch）では成果物だけ作って動作を確かめられる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller keyring

      - name: 解析まわりのテスト
        run: |
          python tests/test_parsing.py
          python tests/test_send.py
          python tests/test_concurrency.py
          python tests/test_http.py

      - name: .exe を作る
        run: pyinstaller packaging/fukidashi.spec --noconfirm

      - name: 起動できるか確かめる
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Fukidashi.exe")) { throw "Fukidashi.exe が作られていません" }
          $size = (Get-Item "dist/Fukidashi.exe").Length / 1MB
          Write-Host ("できました: {0:N1} MB" -f $size)

      - name: zip にまとめる
        shell: pwsh
        run: Compress-Archive -Path dist/Fukidashi.exe -DestinationPath dist/Fukidashi-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Fukidashi-Windows
          path: dist/Fukidashi-Windows.zip

      - name: Releases に添付する
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" dist/Fukidashi-Windows.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析まわりのテスト
        run: |
          python3 tests/test_parsing.py
          python3 tests/test_send.py
          python3 tests/test_concurrency.py
          python3 tests/test_http.py

      - name: .app を作る
        run: python3 make_app.py --zip

      - uses: actions/upload-artifact@v4
        with:
          name: Fukidashi-macOS
          path: dist/Fukidashi-macOS.zip

      - name: Releases に添付する
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" dist/Fukidashi-macOS.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
